name: TARI ingest manuale
on:
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama endpoint TARI nazionale BonusFatto
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent --max-time 900             -H "Authorization: Bearer $CRON_SECRET"             "https://bonusfatto.it/api/cron/tari-ingest?limit=1000"
