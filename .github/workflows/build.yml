name: Build BonusFatto
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run build
      - run: node -e "Promise.all([import('./lib/tariScraper.js'), import('./api/cron/scrape.js'), import('./api/tari/[istat].js')]).then(()=>console.log('server modules ok'))"
